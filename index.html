<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CardLedger — カード明細マネージャー</title>
  <meta name="theme-color" content="#10b981" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Tailwind / Chart.js（個人用PWAのため Play CDN を使用。将来ビルド組込へ差し替え可） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          brand: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857' },
          coral:'#fb7185', sun:'#fbbf24', sky:'#38bdf8', grape:'#a78bfa',
        },
        fontFamily: { sans:['"Hiragino Sans"','"Yu Gothic UI"','Meiryo','system-ui','sans-serif'] },
        boxShadow: { pop:'0 8px 24px -6px rgba(16,185,129,.25)' },
      } },
    };
  </script>
  <style>
    body{background:radial-gradient(1200px 600px at 80% -10%,#d1fae5 0%,transparent 60%),radial-gradient(900px 500px at -10% 10%,#fef3c7 0%,transparent 55%),#f8fafc;}
    .card{background:#fff;border:1px solid #eef2f7;border-radius:1.25rem;}
    .chip{border-radius:999px;padding:.15rem .6rem;font-size:.72rem;font-weight:700}
    .navbtn.nav-active{background:#ecfdf5}
    .navbtn.nav-active .navlabel{color:#10b981}
    .navbtn.nav-active .navico{transform:translateY(-2px) scale(1.1)}
    .app-shell{max-width:480px;margin-inline:auto;min-height:100vh;background:rgba(255,255,255,.35);box-shadow:0 0 60px rgba(15,23,42,.06);}
    .bottomnav{padding-bottom:env(safe-area-inset-bottom);}
    @keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
    .animate-pop{animation:pop .25s ease-out}
    body{-webkit-tap-highlight-color:transparent;}
    ::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
  </style>
</head>
<body class="text-slate-800 min-h-screen">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
